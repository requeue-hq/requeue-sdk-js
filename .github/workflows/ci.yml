name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: latchkey-small
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Restore npm cache (Latchkey)
        uses: latchkey-dev/cache-action@v1
        id: latchkey-cache-npm
        with:
          action: restore
          key: npm-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
      - name: Install dependencies
        run: npm ci

      - name: Save npm cache (Latchkey)
        uses: latchkey-dev/cache-action@v1
        if: steps.latchkey-cache-npm.outputs.cache-hit != 'true'
        with:
          action: save
          key: npm-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
